<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
padding-bottom:80px;
}

.header{
background:white;
padding:15px;
border-bottom:1px solid #ddd;
font-weight:bold;
font-size:18px;
}

.card{
background:white;
margin:12px;
padding:15px;
border-radius:10px;
}

.price{
font-size:30px;
font-weight:bold;
color:#2874f0;
}

.cashback{
background:#e8f7ea;
border:1px solid #bde5c3;
margin:12px;
padding:15px;
border-radius:10px;
color:#1b7f3b;
font-weight:bold;
}

.section{
background:white;
margin:12px;
padding:15px;
font-size:20px;
font-weight:bold;
border-radius:10px;
}

.option{
background:white;
margin:12px;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #ddd;
font-size:18px;
}

.paybtn{
position:fixed;
left:0;
bottom:0;
width:100%;
padding:18px;
background:#fb641b;
color:white;
border:none;
font-size:22px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
STEP 3 OF 3<br>
Payments
</div>

<div class="card">
<h2>Bluetooth Speaker</h2>
<div class="price">₹99</div>
</div>

<div class="cashback">
95% Cashback Available
</div>

<div class="section">
UPI Payment
</div>

<div class="option">
<span><img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" width="30" style="vertical-align:middle;margin-right:10px;"> PhonePe</span>
<input type="radio" name="upi" checked>
</div>

<div class="option">
<span><img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Paytm_logo.png" width="30" style="vertical-align:middle;margin-right:10px;"> Paytm</span>
<input type="radio" name="upi">
</div>

<div class="option">
<span><img src="https://cdn-icons-png.flaticon.com/512/159/159832.png" width="30" style="vertical-align:middle;margin-right:10px;"> Scan QR Code</span>
<input type="radio" name="upi">
</div>

<button class="paybtn" onclick="payNow()">
Pay ₹99
</button>

<script>
function payNow(){
alert("Payment Successful");
window.location.href="thankyou.html";
}
</script>

</body>
</html>
