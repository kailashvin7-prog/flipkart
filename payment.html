<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
}

.header{
background:white;
padding:15px;
font-size:16px;
font-weight:bold;
border-bottom:1px solid #ddd;
}

.step{
font-size:30px;
margin-right:10px;
}

.card{
background:#fff;
margin:12px;
padding:15px;
border-radius:10px;
}

.product{
display:flex;
align-items:center;
gap:15px;
}

.product img{
width:70px;
height:70px;
object-fit:contain;
border:1px solid #ddd;
border-radius:6px;
}

.product-name{
font-size:18px;
font-weight:bold;
}

.price{
color:#2874f0;
font-size:28px;
font-weight:bold;
margin-top:5px;
}

.cashback{
background:#e8f7ea;
border:1px solid #bde5c3;
margin:12px;
padding:18px;
border-radius:12px;
font-size:18px;
font-weight:bold;
color:#1b7f3b;
}

.section{
background:white;
margin-top:10px;
padding:15px;
font-size:24px;
font-weight:bold;
}

.option{
background:white;
margin:10px 12px;
padding:18px;
border:2px solid #ddd;
border-radius:12px;
font-size:24px;
display:flex;
justify-content:space-between;
align-items:center;
}

.option input{
width:24px;
height:24px;
}

.paybtn{
position:fixed;
bottom:0;
left:0;
width:100%;
padding:18px;
border:none;
background:#fb641b;
color:white;
font-size:24px;
font-weight:bold;
}

@media(max-width:600px){

.product-name{
font-size:16px;
}

.price{
font-size:18px;
}

.section{
font-size:20px;
}

.option{
font-size:18px;
}

.paybtn{
font-size:20px;
}
}
</style>
</head>
