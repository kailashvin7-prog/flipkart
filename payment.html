<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment</title>

<style>
body{
font-family:Arial;
background:#f1f3f6;
margin:0;
}

.header{
background:#2874f0;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}

.box{
background:white;
margin:15px;
padding:15px;
border-radius:8px;
}

.option{
padding:15px;
border-bottom:1px solid #ddd;
font-size:18px;
}

.amount{
font-size:22px;
font-weight:bold;
margin-top:20px;
}

button{
width:100%;
padding:15px;
background:#fb641b;
color:white;
font-size:18px;
border:none;
border-radius:5px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="header">Payment</div>

<div class="box">

<div class="option">📱 UPI Payment</div>

<div class="amount" id="amount">
Amount: ₹299
</div>

<button id="payButton">
Pay Now
</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

// Agar amount URL se aaya hai to use karega
let amount = params.get("amount") || "299";

const upiId = "75687358@ybl";

document.getElementById("amount").textContent =
"Amount: ₹" + amount;

document.getElementById("payButton").onclick = function(){

    const upiLink =
    "upi://pay" +
    "?pa=" + encodeURIComponent(upiId) +
    "&pn=" + encodeURIComponent("My Store") +
    "&am=" + encodeURIComponent(amount) +
    "&cu=INR";

    window.location.href = upiLink;
};

</script>

</body>
</html>
