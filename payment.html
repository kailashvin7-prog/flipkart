<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
padding-bottom:80px;
}

.header{
background:white;
padding:15px;
border-bottom:1px solid #ddd;
font-weight:bold;
font-size:18px;
}

.card{
background:white;
margin:12px;
padding:15px;
border-radius:10px;
}

.price{
font-size:30px;
font-weight:bold;
color:#2874f0;
}
.productSummary{
background:white;
margin:12px;
padding:15px;
border-radius:10px;
display:flex;
align-items:center;
gap:15px;
}

.productSummary img{
width:110px;
height:110px;
object-fit:contain;
border-radius:8px;
background:white;
}

.productInfo{
flex:1;
}

.productInfo h2{
margin:0 0 10px;
font-size:20px;
font-weight:500;
}

.productPrice{
font-size:24px;
font-weight:bold;
color:#2874f0;
}

.totalRow{
margin-top:15px;
padding-top:12px;
border-top:1px solid #eee;
display:flex;
justify-content:space-between;
font-size:18px;
font-weight:bold;
}
.cashback{
background:#e8f7ea;
border:1px solid #bde5c3;
margin:12px;
padding:15px;
border-radius:10px;
color:#1b7f3b;
font-weight:bold;
}

.section{
background:white;
margin:12px;
padding:15px;
font-size:20px;
font-weight:bold;
border-radius:10px;
}

.option{
background:white;
margin:12px;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #ddd;
font-size:18px;
}

.paybtn{
position:fixed;
left:0;
bottom:0;
width:100%;
padding:18px;
background:#fb641b;
color:white;
border:none;
font-size:22px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
STEP 3 OF 3<br>
Payments
</div>

<div class="card productSummary">

  <img src="powerbank.jpg" alt="Power Bank">

  <div class="productInfo">
    <h2>Power Bank</h2>
    <div class="productPrice">₹1499</div>

    <div class="totalRow">
      <span>Total Amount</span>
      <span>₹1499</span>
    </div>
  </div>

</div>
<div class="cashback">
95% Cashback Available
</div>

<div class="section">
UPI Payment
</div>

<div class="option">
<span>
<img src="https://download.logo.wine/logo/PhonePe/PhonePe-Logo.wine.png" width="35" style="vertical-align:middle;margin-right:10px;">
PhonePe
</span>
<input type="radio" name="upi" checked>
</div>

<div class="option">
<span>
<img src="paytm/paytm.png" width="30" style="vertical-align:middle;margin-right:10px;">
Paytm
</span>
<input type="radio" name="upi">
</div>
<div class="option">
<span>
<img src="qr.png" width="30" style="vertical-align:middle;margin-right:10px;">
Scan QR Code
</span>
<input type="radio" name="upi">
</div>

<button class="paybtn" onclick="payNow()">
Pay ₹1499
</button>

<script>
function payNow(){
alert("Payment Successful");
window.location.href="thankyou.html";
}
</script>

</body>
</html>
