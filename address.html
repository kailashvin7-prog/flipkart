<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Address</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#222;
}

.header{
  background:#2874f0;
  color:white;
  height:58px;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:15px;
  font-size:20px;
  font-weight:bold;
}

.back{
  font-size:30px;
  cursor:pointer;
}

.steps{
  background:white;
  display:flex;
  justify-content:space-around;
  padding:16px 5px;
  border-bottom:1px solid #ddd;
}

.step{
  text-align:center;
  color:#999;
  font-size:12px;
}

.circle{
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid #2874f0;
  color:#2874f0;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-weight:bold;
}

.active{
  background:#2874f0;
  color:white;
}

.step p{
  margin:6px 0 0;
}

.form{
  background:white;
  max-width:600px;
  margin:12px auto;
  padding:18px;
}

.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:18px;
}

.input{
  width:100%;
  padding:15px;
  margin-bottom:14px;
  border:1px solid #ccc;
  border-radius:3px;
  font-size:15px;
  outline:none;
}

.input:focus,
textarea:focus,
select:focus{
  border-color:#2874f0;
}

textarea{
  width:100%;
  height:120px;
  padding:15px;
  margin-bottom:14px;
  border:1px solid #ccc;
  border-radius:3px;
  font-size:15px;
  font-family:Arial;
  resize:none;
  outline:none;
}

.row{
  display:flex;
  gap:10px;
}

.row input,
.row select{
  width:50%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:3px;
  font-size:15px;
  background:white;
}

.save{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:0;
  border-radius:3px;
  background:#ff6f00;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:600px){

  .form{
    margin:8px;
    padding:15px;
  }

  .title{
    font-size:18px;
  }

  .row{
    gap:8px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="history.back()">‹</div>
  <div>Delivery Address</div>
</div>


<div class="steps">

  <div class="step">
    <div class="circle">1</div>
    <p>Order Summary</p>
  </div>

  <div class="step">
    <div class="circle active">2</div>
    <p>Address</p>
  </div>

  <div class="step">
    <div class="circle">3</div>
    <p>Payment</p>
  </div>

</div>


<div class="form">

  <div class="title">
    Add Delivery Address
  </div>

  <input
    class="input"
    type="text"
    id="name"
    placeholder="Full Name (Required)*"
  >

  <input
    class="input"
    type="tel"
    id="mobile"
    maxlength="10"
    placeholder="Mobile Number (Required)*"
  >

  <textarea
    id="address"
    placeholder="Address (Required)*"
  ></textarea>

  <input
    class="input"
    type="tel"
    id="pincode"
    maxlength="6"
    placeholder="Pincode (Required)*"
  >

  <div class="row">

    <input
      type="text"
      id="city"
      placeholder="City (Required)*"
    >

    <select id="state">

      <option value="">State (Required)*</option>
      <option>Rajasthan</option>
      <option>Delhi</option>
      <option>Haryana</option>
      <option>Punjab</option>
      </select>

  </div>

  <button class="save"
  onclick="window.location.href='payment.html'">
    Save Address
  </button>

</div>

</body>
</html>
