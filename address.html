<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Address</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;}
.header{background:#2874f0;color:white;padding:15px;font-size:22px;font-weight:bold;}
.box{background:white;margin:15px;padding:15px;border-radius:8px;}
input,select{
width:100%;
padding:12px;
margin:8px 0;
font-size:16px;
box-sizing:border-box;
}
button{
width:100%;
padding:15px;
background:#fb641b;
color:white;
font-size:18px;
border:none;
border-radius:5px;
}
</style>
</head>

<body>

<div class="header">Add Delivery Address</div>

<div class="box">

<input type="text" placeholder="Full Name">

<input type="tel" placeholder="Mobile Number">

<input type="text" placeholder="Pincode">

<input type="text" placeholder="City">

<select>
<option>Rajasthan</option>
<option>Delhi</option>
<option>Uttar Pradesh</option>
<option>Maharashtra</option>
</select>

<input type="text" placeholder="House No.">

<input type="text" placeholder="Road / Area">

<br><br>

<button onclick="location.href='order.html'">
Save Address
</button>

</div>

</body>
</html>
