<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
padding-bottom:75px;
}

.product{
background:white;
max-width:500px;
margin:auto;
padding:15px;
min-height:100vh;
}

.product img{
width:100%;
height:auto;
display:block;
object-fit:contain;
}

h2{
font-size:24px;
margin-top:15px;
}

.price{
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.old{
text-decoration:line-through;
color:gray;
margin-right:8px;
}

.discount{
color:green;
font-weight:bold;
}

.rating{
background:green;
color:white;
display:inline-block;
padding:4px 8px;
border-radius:4px;
margin-top:10px;
}

.timer{
font-size:17px;
margin-top:10px;
}

.buttons{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
z-index:999;
}

.cart{
flex:1;
background:#fff;
color:#000;
border:none;
padding:18px;
font-size:20px;
font-weight:bold;
}

.buy{
flex:1;
background:#ffcc00;
color:#000;
border:none;
padding:18px;
font-size:20px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="product">

<img id="productImage" src="powerbank.jpg">

<h2 id="productName">Power Bank</h2>

<div class="rating" id="productRating">4.5 ★</div>

<p style="margin-top:10px;">
<span class="old" id="oldPrice">₹3999</span>
<span class="discount" id="discount">94% OFF</span>
</p>

<div class="price" id="productPrice">₹1499</div>

<p>Free Delivery in Two Days</p>

<div class="timer">
Offer ends in <span id="countdown">04:59</span>
</div>

<div class="buttons">

<button class="cart">
Add to Cart
</button>

<button class="buy" onclick="localStorage.setItem('selectedProduct', JSON.stringify(product)); window.location.href='address.html'">
Buy Now
</button>

</div>

</div>

<script>

/* Product ID read karna */

const params = new URLSearchParams(window.location.search);
const id = params.get("id");


/* Products ki information */

const products = {

"1": {
name: "Power Bank",
image: "powerbank.jpg",
price: "1499",
old: "3999",
discount: "94",
rating: "4.5"
},

"2": {
name: "Bluetooth Earbuds Pro 2",
image: "airpodspro2.jpg",
price: "160",
old: "1999",
discount: "60",
rating: "4.5"
},

"3": {
name: "Smart Watch",
image: "smartwatch.jpg",
price: "170",
old: "2499",
discount: "50",
rating: "4.3"
},

"4": {
name: "Oneplus Nack Band",
image: "oneplusnackband.jpg",
price: "80",
old: "1257",
discount: "90",
rating: "4.8"
},
  
"5": {
name: "ZEBRONICS SOUND",
image: "zebronics.jpg",
price: "999",
old: "2500",
discount: "80",
rating: "4.9"
},
  
};


/* Jo ID nahi hai to Product 1 */

const product = products[id] || products["1"];


/* Product information page par lagana */

document.getElementById("productImage").src = product.image;

document.getElementById("productName").innerText = product.name;

document.getElementById("productPrice").innerText =
"₹" + product.price;

document.getElementById("oldPrice").innerText =
"₹" + product.old;

document.getElementById("discount").innerText =
product.discount + "% OFF";

document.getElementById("productRating").innerText =
product.rating + " ★";

document.title = product.name;


/* Countdown */

let time = 299;

setInterval(function(){

let minutes = Math.floor(time / 60);
let seconds = time % 60;

document.getElementById("countdown").innerHTML =
minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

if(time > 0){
time--;
}

},1000);

</script>

</body>
</html>
