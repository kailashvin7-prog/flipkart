<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>

<style>
body{
font-family:Arial;
background:#f1f3f6;
margin:0;
}

.header{
background:#2874f0;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}
.steps{
background:white;
display:flex;
justify-content:space-around;
padding:16px 5px;
border-bottom:1px solid #ddd;
}

.step{
text-align:center;
color:#777;
font-size:14px;
}

.circle{
width:44px;
height:44px;
border-radius:50%;
border:2px solid #2874f0;
color:#2874f0;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-weight:bold;
font-size:20px;
}

.active{
background:#2874f0;
color:white;
}
.card{
background:white;
margin:15px;
padding:15px;
border-radius:8px;
}

.product-image{
width:180px;
height:180px;
object-fit:contain;
display:block;
margin:10px auto;
}

.name{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.price{
color:green;
font-size:22px;
font-weight:bold;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

button{
width:100%;
padding:15px;
background:#fb641b;
color:white;
border:none;
font-size:18px;
border-radius:5px;
margin-top:20px;
}
  button{
width:100%;
padding:15px;
background:#fb641b;
color:white;
border:none;
font-size:18px;
border-radius:5px;
margin-top:20px;
}

/* YAHAN CODE PASTE HOGA */

</style>
</style>
</head>

<body>

<div style="background:white;padding:15px;font-size:22px;font-weight:bold;">
  ← Order Summary
</div>

<div class="steps">

  <div class="step">
    <div class="circle active">✓</div>
    <p>Address</p>
  </div>

  <div class="step">
    <div class="circle active">2</div>
    <p>Order Summary</p>
  </div>

  <div class="step">
    <div class="circle">3</div>
    <p>Payment</p>
  </div>

</div>

<div class="card">
<div style="background:#f5f5f5;padding:10px;margin-bottom:15px;border-radius:5px;">
  <b>Delivered to:</b><br>
  Customer Name<br>
  Address will appear here
</div>
<img id="productImage" class="product-image" src="" alt="Product">

<div class="name" id="productName"></div>

<div class="price" id="productPrice"></div>

<p>Delivery Charges : <b>FREE</b></p>

<hr>

<div class="total" id="total"></div>

<button onclick="window.location.href='payment.html'">
Continue
</button>

</div>

<!-- Product Data -->
<script src="script.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const productId = Number(params.get("id"));

const product = products.find(p => p.id === productId);

if(product){

    // Product Name
    document.getElementById("productName").textContent = product.name;

    // Product Price
    const priceNumber = Number(
        product.price.replace("₹","").replace(",","")
    );

    document.getElementById("productPrice").textContent =
        "₹" + priceNumber;

    // Total
    document.getElementById("total").textContent =
        "Total : ₹" + priceNumber;

    // Product Image
    document.getElementById("productImage").src =
        product.image;

    // Payment page
    
}else{

    document.getElementById("productName").textContent =
        "Product not found";

    document.getElementById("productPrice").textContent =
        "₹0";

    document.getElementById("total").textContent =
        "Total : ₹0";

    document.getElementById("productImage").style.display =
        "none";
}

</script>

</body>
</html>
