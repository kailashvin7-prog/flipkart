<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Order Summary</title>
<style>
body{
font-family:Arial;
background:#f1f3f6;
margin:0;
}
.header{
background:#2874f0;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}
.card{
background:white;
margin:15px;
padding:15px;
border-radius:8px;
}
img{
width:120px;
display:block;
margin:auto;
}
.name{
font-size:20px;
font-weight:bold;
margin-top:10px;
}
.price{
color:green;
font-size:22px;
font-weight:bold;
}
.total{
font-size:22px;
font-weight:bold;
margin-top:10px;
}
button{
width:100%;
padding:15px;
background:#fb641b;
color:white;
border:none;
font-size:18px;
border-radius:5px;
margin-top:20px;
}
</style>
</head>
<body>

<div class="header">Order Summary</div>

<div class="card">

<div class="name" id="productName"></div>

<div class="price" id="productPrice"></div>

<p>Delivery Charges : <b>FREE</b></p>

<hr>

<div class="total">Total : ₹900</div>

<button onclick="location.href='payment.html'">
Continue to Payment
</button>

</div>
<script>
const params = new URLSearchParams(location.search);

const product = params.get("product") || "Product";
const price = params.get("price") || "0";

document.getElementById("productName").textContent = product;
document.getElementById("productPrice").textContent = "₹" + price.replace("₹", "");

document.querySelector(".total").textContent =
  "Total : ₹" + price.replace("₹", "");

document.querySelector("button").onclick = function(){
  location.href = "payment.html" + location.search;
};
</script>
</body>
</html>
